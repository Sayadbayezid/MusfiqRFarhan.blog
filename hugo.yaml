baseURL: "https://www.musfiqrfarhan.blog"
languageCode: "en-us"
title: "Mushfiq R Farhan"
theme: hugo-profile

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    weight: 1
    contentDir: "content"
    menu:
      main:
        - identifier: blog
          name: Blog
          title: Blog posts
          url: /blogs
          weight: 1
        - identifier: gallery
          name: Gallery
          title: Image gallery
          url: /gallery
          weight: 2

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

Menus:
  main:
    - identifier: gallery
      name: Gallery
      title: Gallery
      url: /gallery
      weight: 2

params:
  title: "Mushfiq R Farhan"
  description: "Official Blog and Portfolio of Mushfiq R Farhan"
  favicon: "/fav.png"
  useBootstrapCDN: false
  mathjax: false
  animate: true

  font:
    fontSize: 1rem 
    fontWeight: 400 
    lineHeight: 1.5 
    textAlign: left 

  navbar:
    align: ms-auto 
    brandName: "Mushfiq R Farhan" 
    disableSearch: false
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: true
      disableEducation: true
      disableProjects: true
      disableAchievements: true
      disableContact: false

  # Hero Section (হোমপেজের একদম উপরের অংশ)
  hero:
    enable: true
    intro: "Welcome to the official website of"
    title: "Mushfiq R. Farhan"
    subtitle: "Actor & Public Figure"
    content: "Stay connected for the latest updates, exclusive blogs, and behind-the-scenes moments."
    image: /images/hero.svg
    bottomImage:
      enable: true
    button:
      enable: false
      name: "Resume"
      url: "#"
      download: true
      newPage: false
    # সোশ্যাল লিংকগুলো এখানে সেট করা হয়েছে
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-facebook
          url: "https://www.facebook.com/share/1cQdw7JcMs/?mibextid=wwXIfr"
        - icon: fab fa-instagram
          url: "https://www.instagram.com/musfiqfarhan?igsh=MWxxeWI3aTkzbHM5cQ=="
        - icon: fab fa-youtube
          url: "https://youtube.com/@musfiqrfarhan?si=gG4wQxD6qsIpVZCZ"
        - icon: fab fa-whatsapp
          url: "https://whatsapp.com/channel/0029VbBdG03HQbS1bTrVHF1X"
        - icon: fas fa-film
          url: "https://www.imdb.com/name/nm11068428/bio/"

  # About Section
  about:
    enable: true
    title: "About Mushfiq R Farhan"
    image: "/images/me.png"
    content: |-
      Mushfiq R Farhan is a renowned actor and public figure... [You can easily edit this text later to add his full biography].
    skills:
      enable: false

  # নিচের সেকশনগুলো আপাতত বন্ধ (false) রাখা হয়েছে ক্লিন লুকের জন্য
  experience:
    enable: false
  education:
    enable: false
  achievements:
    enable: false
  projects:
    enable: false

  # Contact Section
  contact:
    enable: true
    content: For business inquiries, collaborations, or PR, please get in touch.
    btnName: Contact
    btnLink: mailto:contact@musfiqrfarhan.blog

  # Footer Section
  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: Recent Posts
      enable: true
      disableFeaturedImage: false
    socialNetworks:
      facebook: "https://www.facebook.com/share/1cQdw7JcMs/?mibextid=wwXIfr"
      instagram: "https://www.instagram.com/musfiqfarhan?igsh=MWxxeWI3aTkzbHM5cQ=="

  listPages:
    disableFeaturedImage: false

  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  # Footer Copyright 
  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "© 2026 Mushfiq R Farhan. All rights reserved."
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"
