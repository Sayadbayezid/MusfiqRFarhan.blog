name: "Check spelling"
on:
  push:
  pull_request:
    branches-ignore:
      - "dependabot/**"
permissions:
  contents: read
jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: streetsidesoftware/cspell-action@v6
        with:
          incremental_files_only: true
          strict: true
          
      - uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          check_hidden: true
          only_warn: false
